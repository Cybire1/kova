# Every push to main or monad, and every pull request: the same checks a contributor runs locally
# (see AGENTS.md). Five jobs, in parallel:
#   check      typecheck all packages, lint (Biome), unit tests of the shared packages
#   api        the API's tests against a real Postgres
#   web        the website builds (Next.js)
#   ios        the iOS app typechecks (Expo, installed with npm outside the pnpm workspace)
#   contracts  KovaCard and KovaRates (Foundry)
name: CI

on:
  push:
    branches: [main, monad]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (packages/*)
        run: pnpm --filter "./packages/*" test

  api:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kova
          POSTGRES_PASSWORD: kova
          POSTGRES_DB: kova_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kova:kova@localhost:5432/kova_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kova/api test

  web:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kova/web build

  ios:
    name: iOS app typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Builds packages/* (the app imports @kova/monad's dist through a file: dependency).
      - run: pnpm install --frozen-lockfile
      - name: Install the app (npm, outside the pnpm workspace)
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/mobile
        run: |
          # Expo writes this on `expo start`; it is git-ignored, so CI writes it the same way.
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: KovaCard (card limits, freeze, cosigner, savings)
        working-directory: apps/card/contracts
        run: forge test -vv
      - name: KovaRates (Chainlink CRE reports)
        working-directory: apps/rates/contracts
        run: forge test -vv
